name: Build and push Docker images

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_DOCKERHUB: docker.io/montferret/chromium
  IMAGE_GHCR: ghcr.io/montferret/chromium
  CHROME_CHANNEL: Stable

jobs:
  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Chrome version
        id: chrome
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f CHROME_VERSION ]; then
            echo "CHROME_VERSION file is missing" >&2
            exit 1
          fi

          version="$(cat CHROME_VERSION | tr -d '[:space:]')"

          if [ -z "$version" ]; then
            echo "CHROME_VERSION is empty" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chrome version: $version"

      - name: Validate release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          chrome_version="${{ steps.chrome.outputs.version }}"
          release_tag="$RELEASE_TAG"

          if [ "$release_tag" = "$chrome_version" ]; then
            echo "Release tag matches Chrome version: $release_tag"
            exit 0
          fi

          if [[ "$release_tag" =~ ^"${chrome_version}"-r[0-9]+$ ]]; then
            echo "Release tag is a packaging revision for Chrome version: $release_tag"
            exit 0
          fi

          echo "Invalid release tag: $release_tag" >&2
          echo "Expected either:" >&2
          echo "  ${chrome_version}" >&2
          echo "  ${chrome_version}-rN" >&2
          exit 1

      - name: Validate Chrome for Testing download
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.chrome.outputs.version }}"
          url="https://storage.googleapis.com/chrome-for-testing-public/${version}/linux64/chrome-linux64.zip"

          echo "Checking $url"
          curl -fsI "$url" >/dev/null

      - name: Prepare Docker tags
        if: github.event_name == 'release'
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG"
          prerelease="${{ github.event.release.prerelease }}"

          {
            echo "tags<<EOF"

            echo "${IMAGE_DOCKERHUB}:${release_tag}"
            echo "${IMAGE_GHCR}:${release_tag}"

            if [ "$prerelease" = "false" ]; then
              echo "${IMAGE_DOCKERHUB}:latest"
              echo "${IMAGE_DOCKERHUB}:stable"

              echo "${IMAGE_GHCR}:latest"
              echo "${IMAGE_GHCR}:stable"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release artifact
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/chromium.tar
          platforms: linux/amd64
          build-args: |
            CHROME_VERSION=${{ steps.chrome.outputs.version }}
            CHROME_CHANNEL=${{ env.CHROME_CHANNEL }}
          tags: montferret/chromium:candidate
          labels: |
            org.opencontainers.image.title=Ferret Chromium
            org.opencontainers.image.description=Headless Chrome image for Ferret CDP automation
            org.opencontainers.image.version=${{ github.event.release.tag_name || steps.chrome.outputs.version }}
            org.opencontainers.image.vendor=MontFerret
            org.opencontainers.image.url=https://www.montferret.dev/
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.montferret.chrome.version=${{ steps.chrome.outputs.version }}
            dev.montferret.chrome.channel=${{ env.CHROME_CHANNEL }}

      - name: Load the release artifact for testing
        run: |
          command -v skopeo || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          skopeo --override-os linux --override-arch amd64 copy \
            "oci-archive:$RUNNER_TEMP/chromium.tar" docker-daemon:montferret/chromium:candidate

      - name: Gate publication on the full browser suite
        uses: ./.github/actions/compatibility
        with:
          mode: full
          image: montferret/chromium:candidate

      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested release artifact
        if: github.event_name == 'release'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/chromium.tar" "docker://$tag"
          done <<< "$TAGS"
